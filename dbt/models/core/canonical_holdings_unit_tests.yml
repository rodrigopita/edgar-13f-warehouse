version: 2

unit_tests:
  - name: an_addition_loses_the_holdings_it_copies_and_keeps_the_rest
    description: "Janus Henderson shape, period 2022-09-30. The addition repeats most of the original and adds a few; a holding identical to one of the original is a copy and leaves, a holding of a security the original also has but with another amount stays, and a new security stays."
    model: canonical_holdings
    given:
      - input: ref('holdings')
        format: sql
        rows: |
          select 'O' as accession_number, 'data_set' as origin, 1 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C1' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'SOLE' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 1 as source_row
          union all select 'O' as accession_number, 'data_set' as origin, 2 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C2' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'SOLE' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 2 as source_row
          union all select 'O' as accession_number, 'data_set' as origin, 3 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C3' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'SOLE' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 3 as source_row
          union all select 'A' as accession_number, 'data_set' as origin, 1 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C1' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'SOLE' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 1 as source_row
          union all select 'A' as accession_number, 'data_set' as origin, 2 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C2' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 200 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'SOLE' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 2 as source_row
          union all select 'A' as accession_number, 'data_set' as origin, 3 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C4' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'SOLE' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 3 as source_row
      - input: ref('lineage_filings')
        rows:
          - {accession_number: "O", cik: "1", period_of_report: "2024-03-31", filing_position: 1, filing_role: "original", is_contributing: true}
          - {accession_number: "A", cik: "1", period_of_report: "2024-03-31", filing_position: 2, filing_role: "addition", is_contributing: true}
      - input: ref('filings')
        rows:
          - {accession_number: "O", filing_date: "2024-05-01"}
          - {accession_number: "A", filing_date: "2024-06-01"}
    expect:
      rows:
        - {accession_number: "O", cusip: "C1", holding_key: 1}
        - {accession_number: "O", cusip: "C2", holding_key: 2}
        - {accession_number: "O", cusip: "C3", holding_key: 3}
        - {accession_number: "A", cusip: "C2", holding_key: 2}
        - {accession_number: "A", cusip: "C4", holding_key: 3}

