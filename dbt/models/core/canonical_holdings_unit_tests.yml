          union all select 'O' as accession_number, 'data_set' as origin, 3 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C3' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'SOLE' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 3 as source_row
          union all select 'O' as accession_number, 'data_set' as origin, 4 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C4' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'SOLE' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 4 as source_row
          union all select 'A' as accession_number, 'data_set' as origin, 1 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C1' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'SOLE' as investment_discretion, array_construct(2) as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 1 as source_row
          union all select 'A' as accession_number, 'data_set' as origin, 2 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C2' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'DFND' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 2 as source_row
          union all select 'A' as accession_number, 'data_set' as origin, 3 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C3' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'PRN' as shares_or_principal_amount_type, cast(null as varchar) as put_call, 'SOLE' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 3 as source_row
          union all select 'A' as accession_number, 'data_set' as origin, 4 as holding_key, 'n' as name_of_issuer, 't' as title_of_class, 'C4' as cusip, 'f' as figi, 1 as value_as_filed, 'dollars' as value_unit, 1 as value_usd, 100 as shares_or_principal_amount, 'SH' as shares_or_principal_amount_type, 'Put' as put_call, 'SOLE' as investment_discretion, array_construct() as other_manager_sequence_numbers, 1 as voting_sole, 0 as voting_shared, 0 as voting_none, 'z' as source_file, 4 as source_row
      - input: ref('lineage_filings')
