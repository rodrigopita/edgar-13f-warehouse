version: 2

models:
  - name: filings
    description: One row per filing from both paths, the cover and summary page beside EDGAR's own record of the submission.
    columns:
      - name: accession_number
        description: The key. An accession on both paths fails the unique test; the precedence rule waits for the first overlap.
        tests: [unique, not_null]
      - name: cik
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('filers')
                field: cik
      - name: filing_date
        tests: [not_null]
      - name: period_of_report
        tests: [not_null]
      - name: submission_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["13F-HR", "13F-HR/A", "13F-NT", "13F-NT/A"]
      - name: origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["data_set", "walk"]

  - name: lineage_filings
    description: Every filing in its lineage, one filer and one period of report, with its filing position, its role and its supersedence state.
    columns:
      - name: accession_number
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('filings')
                field: accession_number
      - name: period_of_report
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('periods')
                field: period_of_report
      - name: filing_position
        tests: [not_null]
      - name: filing_role
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["original", "restatement", "addition", "notice"]
      - name: is_superseded
        tests: [not_null]
      - name: is_contributing
        tests: [not_null]

  - name: addition_coverage
    description: One row per filing typed as an addition, with the filing it amends and how much of that filing's securities it repeats. At 0.9 or more it is read as a restatement.
    columns:
      - name: accession_number
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('filings')
                field: accession_number
      - name: compared_accession_number
        tests:
          - relationships:
              arguments:
                to: ref('filings')
                field: accession_number
      - name: is_read_as_restatement
        tests: [not_null]

  - name: filing_value_units
    description: The unit each filing with holdings reports market value in, read from its median value per share as filed, with the filing-date rule beside it.
    columns:
      - name: accession_number
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('filings')
                field: accession_number
      - name: value_unit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["thousands", "dollars"]
      - name: value_multiplier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1000, 1]
                quote: false

  - name: holdings
    description: One row per holding from both paths, typed, its value as filed and in dollars by its filing's unit, in effect or not.
    columns:
      - name: accession_number
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('filings')
                field: accession_number
      - name: origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["data_set", "walk"]
      - name: holding_key
        tests: [not_null]
      - name: cusip
        tests: [not_null]
      - name: value_as_filed
        tests: [not_null]
      - name: value_unit
        tests: [not_null]
      - name: value_usd
        tests: [not_null]

  - name: canonical_holdings
    description: For each filer and period of report, the holdings of the contributing filings and nothing else.
    columns:
      - name: cik
        tests: [not_null]
      - name: period_of_report
        tests: [not_null]
      - name: accession_number
        tests: [not_null]
      - name: filing_role
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["original", "restatement", "addition"]

  - name: data_quality_rows
    description: Facts about a filing that the rules resolved without the source settling them, or that the source contradicts, one row per filing and check.
    columns:
      - name: check_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - untyped_amendment
                  - second_original
                  - cover_box_disagrees_with_submission_type
                  - report_type_disagrees_with_submission_type
                  - period_disagrees_with_cover
                  - lineage_starts_with_amendment
                  - filings_of_one_date_across_submitters
                  - summary_disagrees_with_holdings
                  - superseded_addition_not_restated
                  - repeated_security_in_addition
                  - addition_read_as_restatement
                  - copied_holding_in_addition
                  - filing_order_set_by_amendment_number
                  - value_unit_overrides_filing_date_rule
                  - value_off_yardstick_by_a_thousand
                  - notice_with_holdings
      - name: accession_number
        tests: [not_null]

  - name: periods
    description: One row per period that a filing names, the calendar quarter end it reports on, with the quarter end before it. A period that is no quarter end stays in, with no previous period.
    columns:
      - name: period_of_report
        description: The key, the period as EDGAR records it.
        tests: [unique, not_null]
      - name: is_quarter_end
        description: Whether the period is the last day of March, June, September or December.
      - name: previous_period
        description: The quarter end three months before, null unless the period is a quarter end.

  - name: filers
    description: One row per filer, with the name on its latest filing that carries one and the span of periods it filed for.
    columns:
      - name: cik
        description: The key.
        tests: [unique, not_null]
      - name: filer_name
        description: The filing manager name on the filer's latest named filing, by filing date then accession number.

  - name: securities
    description: One row per CUSIP in the canonical holdings, with the name and class filers most often reported in its last period, the FIGI where they reported only one, and whether the CUSIP is well formed and passes its check digit.
    columns:
      - name: cusip
        description: The key.
        tests: [unique, not_null]
      - name: figi_count
        description: The number of distinct FIGIs reported for the CUSIP.
      - name: is_well_formed
        description: Nine characters, the first eight a digit, an upper-case letter or one of * @ #, the ninth a digit.
      - name: has_valid_check_digit
        description: The standard CUSIP check digit holds. Null when the CUSIP is not well formed.
