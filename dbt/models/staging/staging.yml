version: 2

models:
  - name: stg_dataset_submission
    description: One row per filing in the data sets, typed. is_amendment comes from the submission type.
    columns:
      - name: accession_number
        tests: [unique, not_null]
      - name: filing_date
        tests: [not_null]
      - name: submission_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                  values: ["13F-HR", "13F-HR/A", "13F-NT", "13F-NT/A"]
      - name: cik
        tests: [not_null]
      - name: period_of_report
        tests: [not_null]

  - name: stg_dataset_coverpage
    description: The cover page of each filing in the data sets, typed. is_amendment is the box as the filer ticked it, Y, N or blank.
    columns:
      - name: accession_number
        tests: [unique, not_null]
      - name: amendment_type
        tests:
          - accepted_values:
              arguments:
                  values: ["RESTATEMENT", "NEW HOLDINGS"]
      - name: report_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                  values: ["13F HOLDINGS REPORT", "13F NOTICE", "13F COMBINATION REPORT"]

  - name: stg_dataset_infotable
    description: One row per holding in the data sets, typed, value as filed.
    columns:
      - name: accession_number
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('stg_dataset_submission')
                  field: accession_number
      - name: infotable_sk
        tests: [not_null]
      - name: cusip
        tests: [not_null]
      - name: value_as_filed
        tests: [not_null]
      - name: shares_or_principal_amount_type
        tests:
          - accepted_values:
              arguments:
                  values: ["SH", "PRN"]
      - name: put_call
        tests:
          - accepted_values:
              arguments:
                  values: ["Put", "Call"]
      - name: investment_discretion
        tests:
          - accepted_values:
              arguments:
                  values: ["SOLE", "DFND", "OTR"]

  - name: stg_dataset_summarypage
    description: The totals a holdings report declares, typed, value total as filed.
    columns:
      - name: accession_number
        tests: [unique, not_null]

  - name: stg_dataset_othermanager
    description: The other managers reporting for the filer, from the cover page.
    columns:
      - name: accession_number
        tests: [not_null]

  - name: stg_dataset_othermanager2
    description: The other managers included in a filing, from the summary page, with the sequence number holdings refer to.
    columns:
      - name: accession_number
        tests: [not_null]
      - name: sequence_number
        tests: [not_null]

  - name: stg_dataset_signature
    description: The signature block of each filing in the data sets, typed.
    columns:
      - name: accession_number
        tests: [not_null]

  - name: stg_xml_filing_records
    description: The JSON lines of the XML path, one file version per filing, the envelope opened.
    columns:
      - name: accession_number
        tests: [not_null]
      - name: record_type
        tests:
          - accepted_values:
              arguments:
                  values: ["cover", "holding"]
      - name: filing_date
        tests: [not_null]

  - name: stg_xml_cover_pages
    description: The cover page and summary page of each filing parsed from XML, named as the data set models.
    columns:
      - name: accession_number
        tests: [unique, not_null]
      - name: submission_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                  values: ["13F-HR", "13F-HR/A", "13F-NT", "13F-NT/A"]
      - name: cik
        tests: [not_null]
      - name: period_of_report
        tests: [not_null]
      - name: amendment_type
        tests:
          - accepted_values:
              arguments:
                  values: ["RESTATEMENT", "NEW HOLDINGS"]
      - name: report_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                  values: ["13F HOLDINGS REPORT", "13F NOTICE", "13F COMBINATION REPORT"]

  - name: stg_xml_holdings
    description: One row per holding parsed from XML, named as the data set holdings, value as filed.
    columns:
      - name: accession_number
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('stg_xml_cover_pages')
                  field: accession_number
      - name: row_index
        tests: [not_null]
      - name: cusip
        tests: [not_null]
      - name: value_as_filed
        tests: [not_null]
      - name: shares_or_principal_amount_type
        tests:
          - accepted_values:
              arguments:
                  values: ["SH", "PRN"]
      - name: investment_discretion
        tests:
          - accepted_values:
              arguments:
                  values: ["SOLE", "DFND", "OTR"]

  - name: stg_xml_other_managers
    description: The other managers a parsed cover page names, from its cover list and its summary list.
    columns:
      - name: accession_number
        tests: [not_null]
      - name: listed_on
        tests:
          - accepted_values:
              arguments:
                  values: ["cover", "summary"]

  - name: stg_audit_walk_runs
    description: The walk's audit records, one row per record file, with what the attempt discovered, landed and parsed.
    columns:
      - name: run_id
        tests: [not_null]
      - name: walk_day
        tests: [not_null]
      - name: recorded_at
        tests: [not_null]
      - name: source_file
        tests: [unique, not_null]

  - name: stg_audit_walk_days
    description: One row per walk audit record and day it walked, with the 13F filings the day's index listed by submission type.
    columns:
      - name: walk_day
        tests: [not_null]
      - name: discovered
        tests: [not_null]

  - name: stg_audit_walk_failures
    description: One row per filing a walk audit record names as failed to land or to parse.
    columns:
      - name: accession_number
        tests: [not_null]
      - name: failure_stage
        tests:
          - accepted_values:
              arguments:
                  values: ["land", "parse"]

  - name: stg_audit_backfill_tables
    description: One row per backfill audit record and data set table, with the rows extracted and the rows and files loaded.
    columns:
      - name: table_name
        tests:
          - accepted_values:
              arguments:
                  values: ["COVERPAGE", "INFOTABLE", "OTHERMANAGER", "OTHERMANAGER2", "SIGNATURE", "SUBMISSION", "SUMMARYPAGE"]

unit_tests:
  # An expectation written as SQL is compared on every column of the model,
  # so the untested columns are listed as typed nulls, the value the model
  # gives a column the fixture leaves blank. The dict form would compare only
  # the listed columns but cannot carry an ARRAY.
  - name: values_stay_as_filed_and_other_managers_become_sequence_numbers
    description: VALUE keeps the number the filer wrote, whatever the filing date; the other-manager field becomes sequence numbers, NONE and blank an empty list.
    model: stg_dataset_infotable
    given:
      - input: source('raw', 'dataset_infotable')
        rows:
          - {accession_number: "A", infotable_sk: "1", value: "534", othermanager: "1, 2"}
          - {accession_number: "B", infotable_sk: "2", value: "534", othermanager: "NONE"}
          - {accession_number: "C", infotable_sk: "3", value: "534", othermanager: ""}
    expect:
      format: sql
      rows: |
        select 'A' as accession_number, 1 as infotable_sk, null::varchar as name_of_issuer, null::varchar as title_of_class, null::varchar as cusip, null::varchar as figi, 534 as value_as_filed, null::number as shares_or_principal_amount, null::varchar as shares_or_principal_amount_type, null::varchar as put_call, null::varchar as investment_discretion, '1, 2' as other_manager, array_construct(1, 2) as other_manager_sequence_numbers, null::number as voting_sole, null::number as voting_shared, null::number as voting_none, null::varchar as source_file, null::number as source_row, null::varchar as source_content_key, null::timestamp_ntz as source_last_modified union all
        select 'B', 2, null::varchar, null::varchar, null::varchar, null::varchar, 534, null::number, null::varchar, null::varchar, null::varchar, 'NONE', array_construct(), null::number, null::number, null::number, null::varchar, null::number, null::varchar, null::timestamp_ntz union all
        select 'C', 3, null::varchar, null::varchar, null::varchar, null::varchar, 534, null::number, null::varchar, null::varchar, null::varchar, null::varchar, array_construct(), null::number, null::number, null::number, null::varchar, null::number, null::varchar, null::timestamp_ntz

  - name: cover_page_flags_and_dates_are_typed
    description: Y, N and blank become true, false and null; DD-MON-YYYY becomes a date; blank text becomes null.
    model: stg_dataset_coverpage
    given:
      - input: source('raw', 'dataset_coverpage')
        rows:
          - {accession_number: "A", isamendment: "Y", amendmentno: "3", amendmenttype: "NEW HOLDINGS", reportcalendarorquarter: "30-JUN-2018"}
          - {accession_number: "B", isamendment: "N", amendmentno: "", amendmenttype: "", reportcalendarorquarter: "31-DEC-2017"}
          - {accession_number: "C", isamendment: "", amendmentno: "", amendmenttype: " ", reportcalendarorquarter: "31-MAR-2018"}
    expect:
      format: sql
      rows: |
        select 'A' as accession_number, '2018-06-30'::date as report_calendar_or_quarter, true as is_amendment, 3 as amendment_no, 'NEW HOLDINGS' as amendment_type, null::boolean as conf_denied_expired, null::date as date_denied_expired, null::date as date_reported, null::varchar as reason_for_non_confidentiality, null::varchar as filing_manager_name, null::varchar as filing_manager_street1, null::varchar as filing_manager_street2, null::varchar as filing_manager_city, null::varchar as filing_manager_state_or_country, null::varchar as filing_manager_zip_code, null::varchar as report_type, null::varchar as form_13f_file_number, null::varchar as crd_number, null::varchar as sec_file_number, null::boolean as provide_info_for_instruction5, null::varchar as additional_information, null::varchar as source_file, null::number as source_row, null::varchar as source_content_key, null::timestamp_ntz as source_last_modified union all
        select 'B', '2017-12-31'::date, false, null::number, null::varchar, null::boolean, null::date, null::date, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::boolean, null::varchar, null::varchar, null::number, null::varchar, null::timestamp_ntz union all
        select 'C', '2018-03-31'::date, null::boolean, null::number, null::varchar, null::boolean, null::date, null::date, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::varchar, null::boolean, null::varchar, null::varchar, null::number, null::varchar, null::timestamp_ntz

  - name: one_file_version_per_parsed_filing
    description: A filing loaded twice keeps the rows of the file written last, and the filing date is read from the landing path.
    model: stg_xml_filing_records
    given:
      - input: source('raw', 'parsed_filings')
        format: sql
        rows: |
          select parse_json('{"accession": "X", "record_type": "cover", "source_key": "k", "record": {"cik": 1}}') as record,
                 'parsed/edgar/filings/filed=2026-09-02/X.jsonl' as source_file, 1 as source_row,
                 'old' as source_content_key, '2026-09-02 07:00:00'::timestamp_ntz as source_last_modified union all
          select parse_json('{"accession": "X", "record_type": "holding", "source_key": "k", "record": {"row_index": 1}}'),
                 'parsed/edgar/filings/filed=2026-09-02/X.jsonl', 2, 'old', '2026-09-02 07:00:00'::timestamp_ntz union all
          select parse_json('{"accession": "X", "record_type": "cover", "source_key": "k", "record": {"cik": 1}}'),
                 'parsed/edgar/filings/filed=2026-09-02/X.jsonl', 1, 'new', '2026-09-20 07:00:00'::timestamp_ntz union all
          select parse_json('{"accession": "Y", "record_type": "cover", "source_key": "k", "record": {"cik": 2}}'),
                 'parsed/edgar/filings/filed=2026-09-03/Y.jsonl', 1, 'only', '2026-09-03 07:00:00'::timestamp_ntz
    expect:
      rows:
        - {accession_number: "X", record_type: "cover", source_content_key: "new", filing_date: "2026-09-02"}
        - {accession_number: "Y", record_type: "cover", source_content_key: "only", filing_date: "2026-09-03"}

  - name: one_row_per_audit_record_and_null_parse_counts_before_parsing
    description: A record loaded by both the bulk COPY and the pipe counts once; a record written before the walk parsed has no parse counts.
    model: stg_audit_walk_runs
    given:
      - input: source('audit', 'walk_runs')
        format: sql
        rows: |
          select parse_json('{"run_id": "scheduled__2026-10-21T06:00:00+00:00", "day": "2026-10-20", "recorded_at": "2026-10-21T06:10:41.1+00:00", "published": true, "discovered": 321, "landed": 321, "already_present": 0, "failed": [], "parsed": 321, "parse_failed": [{"accession": "X"}], "reconcile_gaps": []}') as record,
                 'day=2026-10-20/scheduled.json' as source_file, 'k1' as source_content_key, '2026-10-21 06:10:41'::timestamp_ntz as source_last_modified union all
          select parse_json('{"run_id": "scheduled__2026-10-21T06:00:00+00:00", "day": "2026-10-20", "recorded_at": "2026-10-21T06:10:41.1+00:00", "published": true, "discovered": 321, "landed": 321, "already_present": 0, "failed": [], "parsed": 321, "parse_failed": [{"accession": "X"}], "reconcile_gaps": []}'),
                 'day=2026-10-20/scheduled.json', 'k1', '2026-10-21 06:10:41'::timestamp_ntz union all
          select parse_json('{"run_id": "scheduled__2026-09-02T06:00:00+00:00", "day": "2026-09-02", "recorded_at": "2026-10-04T15:47:28+00:00", "published": true, "discovered": 4, "landed": 4, "already_present": 0, "failed": []}'),
                 'day=2026-09-02/scheduled.json', 'k2', '2026-10-04 15:47:28'::timestamp_ntz
    expect:
      rows:
        - {run_id: "scheduled__2026-10-21T06:00:00+00:00", walk_day: "2026-10-20", discovered: 321, landing_failures: 0, parsed: 321, parse_failures: 1}
        - {run_id: "scheduled__2026-09-02T06:00:00+00:00", walk_day: "2026-09-02", discovered: 4, landing_failures: 0, parsed: null, parse_failures: null}

  - name: a_record_walks_its_own_day_and_the_days_it_swept
    description: One record that walked 2026-09-22 and swept 2026-09-21 gives a row per day with the index's counts by submission type, a type the index did not list reading zero.
    model: stg_audit_walk_days
    given:
      - input: source('audit', 'walk_runs')
        format: sql
        rows: |
          select parse_json('{"run_id": "manual", "recorded_at": "2026-10-04T04:48:17+00:00", "days": {"2026-09-22": {"key": "raw/edgar/index/form.20260922.idx", "discovered": 5, "by_form": {"13F-HR": 3, "13F-HR/A": 1, "13F-NT": 1}}, "2026-09-21": {"key": "raw/edgar/index/form.20260921.idx", "discovered": 2, "by_form": {"13F-HR": 2}}}}') as record,
                 'day=2026-09-22/manual.json' as source_file, 'k' as source_content_key, '2026-10-04 04:48:17'::timestamp_ntz as source_last_modified
    expect:
      rows:
        - {walk_day: "2026-09-22", discovered: 5, holdings_reports: 3, holdings_report_amendments: 1, notices: 1, notice_amendments: 0, index_key: "raw/edgar/index/form.20260922.idx"}
        - {walk_day: "2026-09-21", discovered: 2, holdings_reports: 2, holdings_report_amendments: 0, notices: 0, notice_amendments: 0, index_key: "raw/edgar/index/form.20260921.idx"}

  - name: failures_to_land_and_to_parse_each_give_a_row
    description: A record with one landing failure and one parse failure gives two rows; a record written before the walk parsed, with no parse_failed list, gives none.
    model: stg_audit_walk_failures
    given:
      - input: source('audit', 'walk_runs')
        format: sql
        rows: |
          select parse_json('{"run_id": "r", "day": "2026-10-16", "recorded_at": "2026-10-17T06:09:20+00:00", "failed": [{"accession": "L", "form_type": "13F-HR", "error": "HTTPError: 404"}], "parse_failed": [{"accession": "N", "form_type": "13F-NT", "error": "XmlRecordError: a notice has no summary page"}]}') as record,
                 'day=2026-10-16/r.json' as source_file, 'k1' as source_content_key, '2026-10-17 06:09:20'::timestamp_ntz as source_last_modified union all
          select parse_json('{"run_id": "old", "day": "2026-09-02", "recorded_at": "2026-10-04T15:47:28+00:00", "failed": []}'),
                 'day=2026-09-02/old.json', 'k2', '2026-10-04 15:47:28'::timestamp_ntz
    expect:
      rows:
        - {failure_stage: "land", accession_number: "L", submission_type: "13F-HR", error: "HTTPError: 404", walk_day: "2026-10-16"}
        - {failure_stage: "parse", accession_number: "N", submission_type: "13F-NT", error: "XmlRecordError: a notice has no summary page", walk_day: "2026-10-16"}

  - name: a_backfill_record_gives_a_row_per_table
    description: Extracted rows, rows loaded and files loaded are read per table from the record's three maps.
    model: stg_audit_backfill_tables
    given:
      - input: source('audit', 'backfill_runs')
        format: sql
        rows: |
          select parse_json('{"run_id": "manual-r1", "recorded_at": "2026-10-13T12:52:39+00:00", "extracted_rows": {"SUBMISSION": 166, "INFOTABLE": 87715}, "rows_loaded": {"SUBMISSION": 166, "INFOTABLE": 0}, "files_loaded": {"SUBMISSION": 1, "INFOTABLE": 0}}') as record,
                 'manual-r1.json' as source_file, 'k' as source_content_key, '2026-10-13 12:52:41'::timestamp_ntz as source_last_modified
    expect:
      rows:
        - {table_name: "SUBMISSION", extracted_rows: 166, rows_loaded: 166, files_loaded: 1}
        - {table_name: "INFOTABLE", extracted_rows: 87715, rows_loaded: 0, files_loaded: 0}
