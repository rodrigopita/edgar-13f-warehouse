[project]
name = "edgar-13f-warehouse"
version = "0.1.0"
description = "EDGAR 13F warehouse: Snowflake + dbt portfolio project"
requires-python = "==3.14.*"
# Runtime dependencies must be mirrored in requirements.txt, which is what the
# Astro Runtime image actually installs; this venv exists for IDE/tests only.
dependencies = [
    "apache-airflow-providers-amazon==9.36.0",
    "apache-airflow-providers-snowflake==6.17.0",
]

[dependency-groups]
dev = [
    # Already baked into the Astro Runtime image, never add to requirements.txt.
    "apache-airflow==3.3.1",
    "dbt-core>=1.12.5",
    "dbt-snowflake>=1.12.1",
    "pytest>=9",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
extend-exclude = [".astro"]
